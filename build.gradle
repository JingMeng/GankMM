apply from: 'config.gradle'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
}
allprojects {
    repositories {
        maven {
            url rootProject.file('local-maven')
            content {
                includeGroup 'com.leon.channel'
                includeGroup 'com.yqritc'
                includeGroup 'jp.wasabeef'
                includeGroup 'com.tencent'
                includeGroup 'com.github.zhaokaiqiang.klog'
                includeGroup 'com.github.Aspsine'
                includeGroup 'com.ldoublem.thumbUplib'
                includeGroup 'io.github.yavski'
                includeGroup 'com.kelin.scrollablepanel'
                includeGroup 'com.github.promeg'
                includeGroup 'com.contrarywind'
                includeGroup 'com.github.LuckSiege.PictureSelector'
                includeGroup 'com.jaeger.statusbarutil'
                includeGroup 'com.github.chrisbanes.photoview'
            }
        }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
}
tasks.register('clean', Delete) { delete rootProject.layout.buildDirectory }
